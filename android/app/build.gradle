plugins {
    id 'com.android.application'
}

android {
    namespace 'net.zygotelabs.locker'
    compileSdk 35

    defaultConfig {
        applicationId 'net.zygotelabs.locker'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.0.6'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    implementation 'com.android.support:support-v4:28.0.0'
}
